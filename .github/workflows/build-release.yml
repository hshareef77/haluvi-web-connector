name: Signed Android Release
on:
  workflow_dispatch:
    inputs:
      format:
        description: Choose APK or Google Play AAB
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore selected release signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          EXPECTED_APK_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || '8E80AB36333CAFECA4908BD7A4CCF682F8D9DCEC2758D72C2B2E37826421745E' }}
          EXPECTED_PLAY_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
          REQUESTED_FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/android-signing"
          # Always validate the permanent APK identity, even for a Play upload.
          apk_expected=$(printf '%s' "$EXPECTED_APK_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$apk_expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Permanent APK signing certificate fingerprint is not pinned."
            exit 1
          fi
          if [[ -z "$APK_KEYSTORE_BASE64" || -z "$APK_STORE_PASSWORD" || -z "$APK_KEY_PASSWORD" || -z "$APK_KEY_ALIAS" ]]; then
            echo "::error::Permanent APK signing secrets missing."
            exit 1
          fi
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/app.p12"
          apk_actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/android-signing/app.p12" -storepass "$APK_STORE_PASSWORD" -alias "$APK_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')
          if [[ "$apk_actual" != "$apk_expected" ]]; then
            echo "::error::Permanent APK certificate mismatch; release blocked."
            exit 1
          fi
          selected_file="$RUNNER_TEMP/android-signing/app.p12"
          selected_store="$APK_STORE_PASSWORD"
          selected_key="$APK_KEY_PASSWORD"
          selected_alias="$APK_KEY_ALIAS"
          if [[ "$REQUESTED_FORMAT" == "aab" ]]; then
            play_expected=$(printf '%s' "$EXPECTED_PLAY_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
            if [[ ! "$play_expected" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Google Play upload certificate fingerprint is not registered."
              exit 1
            fi
            if [[ -n "$PLAY_KEYSTORE_BASE64" ]]; then
              if [[ -z "$PLAY_STORE_PASSWORD" || -z "$PLAY_KEY_PASSWORD" || -z "$PLAY_KEY_ALIAS" ]]; then
                echo "::error::Separate Google Play upload signing credentials are incomplete."
                exit 1
              fi
              printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/play.p12"
              selected_file="$RUNNER_TEMP/android-signing/play.p12"
              selected_store="$PLAY_STORE_PASSWORD"
              selected_key="$PLAY_KEY_PASSWORD"
              selected_alias="$PLAY_KEY_ALIAS"
            fi
            play_actual=$(keytool -exportcert -keystore "$selected_file" -storepass "$selected_store" -alias "$selected_alias" | sha256sum | awk '{print toupper($1)}')
            if [[ "$play_actual" != "$play_expected" ]]; then
              echo "::error::Google Play upload certificate mismatch. Use its registered upload key."
              exit 1
            fi
          fi
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$selected_file" >> "$GITHUB_ENV"
          # Multiline env file avoids exporting the secret values into logs.
          for var in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            case "$var" in
              ANDROID_KEYSTORE_PASSWORD) value="$selected_store" ;;
              ANDROID_KEY_PASSWORD) value="$selected_key" ;;
              ANDROID_KEY_ALIAS) value="$selected_alias" ;;
            esac
            delimiter="END_${var}_${GITHUB_RUN_ID}"
            printf '%s<<%s\n%s\n%s\n' "$var" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done
          echo "Signing certificate identity verified; proceeding with manual release."
      - name: Build signed APK or AAB
        env:
          REQUESTED_FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REQUESTED_FORMAT" = 'aab' ]; then
            gradle --no-daemon :app:bundleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi
      - name: Publish signed output on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REQUESTED_FORMAT" = "aab" ]; then
            file=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
            label="Google Play AAB"
          else
            file=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)
            label="Signed APK"
          fi
          test -n "$file" && test -s "$file" || { echo "::error::No signed $label produced."; exit 1; }
          tag="android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "$label — build ${GITHUB_RUN_NUMBER}" --notes "Manual build at commit $GITHUB_SHA. Verify Android signing identity before installing updates." --prerelease
